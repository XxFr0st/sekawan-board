name: CI/CD Sekawan Board

# Alur:  push ke main  ->  CI (test, build, smoke test)  ->  push image ke GHCR  ->  CD (deploy ke VPS via SSH)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      container_runtime:
        description: "Runtime container yang dipakai di VPS"
        type: choice
        options: [docker, podman]
        default: docker

# Pipeline lama untuk PR dibatalkan bila ada commit baru; deploy ke produksi tidak pernah dibatalkan di tengah jalan.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ===========================================================================
  # CI 1 - Test backend dengan database PostgreSQL asli (service container)
  # ===========================================================================
  test-backend:
    name: "CI · Test backend"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sekawan
          POSTGRES_PASSWORD: sekawan
          POSTGRES_DB: sekawan_board_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sekawan -d sekawan_board_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Jalankan integration test
        run: npm test
        env:
          DATABASE_URL: postgres://sekawan:sekawan@localhost:5432/sekawan_board_test

  # ===========================================================================
  # CI 2 - Pastikan frontend bisa di-build
  # ===========================================================================
  build-frontend:
    name: "CI · Build frontend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ===========================================================================
  # CI 3 - Smoke test: seluruh stack (db + backend + frontend) dijalankan dengan Docker Compose
  # ===========================================================================
  compose-smoke-test:
    name: "CI · Smoke test Docker Compose"
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan .env dan jalankan stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Tunggu aplikasi sehat
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/api/health; then echo; exit 0; fi
            sleep 3
          done
          echo "Aplikasi tidak sehat"; docker compose ps; docker compose logs --tail=60; exit 1
      - name: Uji alur pendaftaran melalui Nginx -> backend -> database
        run: |
          resp=$(curl -fsS -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Tester","email":"ci@example.com","password":"rahasia123"}')
          echo "$resp" | grep -q '"token"' && echo "Register OK"
      - name: Tampilkan log bila gagal
        if: failure()
        run: docker compose logs --tail=80
      - name: Bersihkan
        if: always()
        run: docker compose down -v

  # ===========================================================================
  # CI 4 - Verifikasi image juga bisa dibangun dan dijalankan dengan PODMAN
  # ===========================================================================
  podman-verify:
    name: "CI · Verifikasi Podman"
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Versi Podman
        run: podman --version
      - name: Build image dengan Podman
        run: |
          podman build -t sekawan-backend:ci ./backend
          podman build -t sekawan-frontend:ci ./frontend
          podman images
      - name: Jalankan stack dengan Podman (tanpa compose)
        continue-on-error: true   # bagian bonus: tidak menggagalkan pipeline utama
        run: |
          podman network create sekawan-net
          podman run -d --name db --network sekawan-net \
            -e POSTGRES_DB=sekawan_board -e POSTGRES_USER=sekawan -e POSTGRES_PASSWORD=sekawan \
            docker.io/library/postgres:16-alpine
          for i in $(seq 1 20); do podman exec db pg_isready -U sekawan && break; sleep 2; done
          podman run -d --name backend --network sekawan-net \
            -e NODE_ENV=production -e JWT_SECRET=ci-secret \
            -e DATABASE_URL=postgres://sekawan:sekawan@db:5432/sekawan_board \
            sekawan-backend:ci
          sleep 5
          podman run -d --name frontend --network sekawan-net -p 8080:8080 sekawan-frontend:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/api/health && echo && exit 0; sleep 3; done
          podman logs backend; exit 1

  # ===========================================================================
  # CD 1 - Build image final dan push ke GitHub Container Registry (hanya dari branch main)
  # ===========================================================================
  build-and-push:
    name: "CD · Build & push image ke GHCR"
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, compose-smoke-test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Tentukan nama image dan tag
        id: meta
        run: |
          echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"   # GHCR mewajibkan huruf kecil
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image_prefix }}-backend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image_prefix }}-backend:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}-frontend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image_prefix }}-frontend:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ===========================================================================
  # CD 2 - Deploy ke VPS lewat SSH (Docker atau Podman)
  # ===========================================================================
  deploy:
    name: "CD · Deploy ke VPS"
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      APP_PORT: ${{ vars.APP_PORT || '8080' }}
      RUNTIME: ${{ inputs.container_runtime || vars.CONTAINER_RUNTIME || 'docker' }}
      REMOTE_DIR: sekawan-board
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan koneksi SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Kirim file compose dan skrip deploy
        run: |
          SSH_OPTS="-i $HOME/.ssh/id_deploy -o BatchMode=yes"
          ssh $SSH_OPTS -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p ~/$REMOTE_DIR"
          scp $SSH_OPTS -P "$VPS_PORT" docker-compose.prod.yml deploy/deploy.sh "$VPS_USER@$VPS_HOST:~/$REMOTE_DIR/"

      - name: Tulis file .env di VPS
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          IMAGE_PREFIX: ${{ needs.build-and-push.outputs.image_prefix }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/id_deploy -o BatchMode=yes"
          ssh $SSH_OPTS -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "umask 077; cat > ~/$REMOTE_DIR/.env" <<EOF
          POSTGRES_DB='sekawan_board'
          POSTGRES_USER='sekawan'
          POSTGRES_PASSWORD='${POSTGRES_PASSWORD}'
          JWT_SECRET='${JWT_SECRET}'
          IMAGE_PREFIX='${IMAGE_PREFIX}'
          IMAGE_TAG='${IMAGE_TAG}'
          APP_PORT='${APP_PORT}'
          CONTAINER_RUNTIME='${RUNTIME}'
          EOF

      - name: Jalankan deploy di VPS (${{ env.RUNTIME }})
        env:
          # PAT opsional (GHCR_PAT) bila paket GHCR bersifat privat dan GITHUB_TOKEN ditolak
          REGISTRY_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/id_deploy -o BatchMode=yes"
          printf '%s' "$REGISTRY_TOKEN" | ssh $SSH_OPTS -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd ~/$REMOTE_DIR && GHCR_USER='$REGISTRY_USER' bash deploy.sh --login-stdin"

      - name: Verifikasi aplikasi dari luar VPS
        run: |
          url="http://${VPS_HOST}:${APP_PORT}/api/health"
          echo "Memeriksa $url"
          curl -fsS --retry 10 --retry-delay 5 --retry-connrefused "$url"
          echo

      - name: Ringkasan deploy
        if: success()
        run: |
          {
            echo "### Deploy berhasil"
            echo "- Runtime: \`${RUNTIME}\`"
            echo "- Versi: \`${{ needs.build-and-push.outputs.tag }}\`"
            echo "- URL: http://${VPS_HOST}:${APP_PORT}"
          } >> "$GITHUB_STEP_SUMMARY"
